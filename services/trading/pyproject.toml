[project]
name = "qs-trading"
version = "0.1.0"
description = "QuantSim Trading service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "qs-template",
  "alembic>=1.14",
]

[project.scripts]
qs-trading = "qs_trading.cli:main"

[tool.uv.sources]
qs-template = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "jsonschema>=4.21",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest-cov>=6.0",
  "schemathesis>=4.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qs_trading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
  "db: needs a PostgreSQL database (TEST_DATABASE_URL)",
  "slow: takes several seconds (deselect with -m 'not slow')",
]
filterwarnings = [
  "error",
  # FastAPI's TestClient still wraps httpx; harmless until FastAPI moves on
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true
