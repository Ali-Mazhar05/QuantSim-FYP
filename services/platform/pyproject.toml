[project]
name = "qs-platform"
version = "0.1.0"
description = "QuantSim M0: platform and identity (users, roles, login, signing keys, audit)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "qs-template",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "email-validator>=2.2",
]

[project.scripts]
qs-platform = "qs_platform.cli:main"

[tool.uv.sources]
qs-template = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "fakeredis>=2.26",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qs_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["db: needs a PostgreSQL database (TEST_DATABASE_URL)"]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true
