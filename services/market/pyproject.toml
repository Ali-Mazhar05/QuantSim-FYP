[project]
name = "qs-market"
version = "0.1.0"
description = "QuantSim M1: market data (instrument master, ingestion, cleaning gate, returns and volatility)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "qs-template",
  "alembic>=1.14",
  "exchange-calendars>=4.5",
]

[tool.uv.sources]
qs-template = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "fakeredis>=2.26",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qs_market"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["db: needs a PostgreSQL database (TEST_DATABASE_URL)"]
filterwarnings = [
  "error",
  # exchange_calendars and pandas emit these on import; not our code
  "ignore::DeprecationWarning:exchange_calendars.*",
  "ignore::DeprecationWarning:pandas.*",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*", "exchange_calendars", "exchange_calendars.*", "pandas", "pandas.*"]
ignore_missing_imports = true
