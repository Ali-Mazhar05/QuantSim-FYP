[project]
name = "qs-template"
version = "0.1.0"
description = "Shared service template for every QuantSim backend service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "structlog>=24.4",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qs_template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["db: needs a PostgreSQL database (TEST_DATABASE_URL)"]
filterwarnings = [
  "error",
  # FastAPI's TestClient still wraps httpx; harmless until FastAPI moves on
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
