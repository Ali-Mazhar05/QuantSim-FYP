[project]
name = "qs-quant"
version = "0.1.0"
description = "Pure quantitative maths for QuantSim: metrics and risk statistics (K6), calibration (K5)"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.100",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qs_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
