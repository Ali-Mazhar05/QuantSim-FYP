  # ---------------------------------------------------------------------------------
  # __Title__ (generated by scripts/new-service.sh). One image, started as the API, a job
  # worker, an outbox relay and a one-shot migration.

  __name__:
    <<: *defaults
    image: ${__NAME___IMAGE:?__NAME___IMAGE comes from the release file}
    environment: &__name__-env
      QS_ENVIRONMENT: ${QS_ENV:?}
      QS_CORS_ORIGINS: ${QS_CORS_ORIGINS:-}
      QS_DATABASE_URL: postgresql+asyncpg://__name__:${__NAME___DB_PASSWORD:?__NAME___DB_PASSWORD comes from the environment's secrets}@postgres:5432/__name__
      QS_REDIS_URL: redis://redis:6379/0
      QS_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      QS_AUTH_JWKS_URL: http://platform:8000/api/platform/.well-known/jwks.json
      QS_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Parallel NumPy work runs in separate jobs, not threads (keeps memory predictable)
      OMP_NUM_THREADS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      platform:
        condition: service_healthy
    networks:
      - default
      - backend
    labels:
      traefik.enable: "true"
      traefik.http.routers.__name__.rule: PathPrefix(`/api/__name__`)
      traefik.http.routers.__name__.entrypoints: web
      traefik.http.services.__name__.loadbalancer.server.port: "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M

  __name__-worker:
    <<: *defaults
    image: ${__NAME___IMAGE:?}
    command: ["python", "-m", "__pkg__", "worker"]
    environment: *__name__-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 512M

  __name__-relay:
    <<: *defaults
    image: ${__NAME___IMAGE:?}
    command: ["python", "-m", "__pkg__", "relay"]
    environment: *__name__-env
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 128M

  __name__-migrate:
    image: ${__NAME___IMAGE:?}
    profiles: ["migrate"]
    restart: "no"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment: *__name__-env
    networks:
      - backend
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true

