# Every deployable component of QuantSim, one per line.
#
#   name      a lowercase id; images are published as <IMAGE_PREFIX>-<name>
#   kind      web (static frontend) or service (backend API or worker)
#   dockerfile, context   what docker build uses
#   paths...  the files that define the image; their git content gives the image tag,
#             so an image is rebuilt only when one of these paths changes
#
# Backend services build from the repository root so they can use libs/ and the
# shared uv lockfile, for example:
#   market    service  services/market/Dockerfile  .  services/market libs/qs_template pyproject.toml uv.lock
#
# name       kind     dockerfile            context    paths...
frontend     web      frontend/Dockerfile   frontend   frontend
platform     service  services/platform/Dockerfile  .  services/platform libs/qs_template pyproject.toml uv.lock
