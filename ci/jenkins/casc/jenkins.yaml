# Jenkins configuration as code, shared by every installation. Applied on every start;
# changes made in the UI are overwritten, so change these files instead.
#
# Login and permissions live in casc/security/<mode>.yaml; JENKINS_AUTH in
# ci/jenkins/.env picks the mode (local on a laptop, github on the CI server).
#
# ${name} values come from Docker secrets mounted at /run/secrets/<name> or from
# environment variables set in compose.yml.

jenkins:
  systemMessage: "QuantSim CI/CD. Configuration is managed in ci/jenkins/ in the repository."
  # The controller only schedules; every build runs on an agent
  numExecutors: 0
  mode: EXCLUSIVE

  nodes:
    - permanent:
        name: "docker-agent"
        nodeDescription: "Runs every QuantSim build; has the Docker CLI and the host's Docker socket"
        labelString: "docker"
        numExecutors: 3
        mode: NORMAL
        remoteFS: "/home/jenkins/agent"
        retentionStrategy: "always"
        launcher:
          ssh:
            host: "agent"
            port: 22
            credentialsId: "agent-ssh-key"
            launchTimeoutSeconds: 60
            maxNumRetries: 10
            retryWaitTime: 15
            # The agent is reachable only on the private compose network
            sshHostKeyVerificationStrategy: "nonVerifyingKeyVerificationStrategy"
        nodeProperties:
          - envVars:
              env:
                - key: "BUILDX_CONFIG"
                  value: "/home/jenkins/agent/.buildx"
                # Known-good releases per environment, kept in the agent's volume
                - key: "QS_RELEASES_DIR"
                  value: "/home/jenkins/agent/releases"

  globalNodeProperties:
    - envVars:
        env:
          - key: "REGISTRY"
            value: "ghcr.io"
          - key: "IMAGE_PREFIX"
            value: "ghcr.io/ali-mazhar05/quantsim"
          - key: "GITHUB_REPO"
            value: "Ali-Mazhar05/QuantSim-FYP"
          # Jenkins user ids, comma separated, allowed to approve ACC and PROD
          - key: "RELEASE_APPROVERS"
            value: "${QS_RELEASE_APPROVERS:-admin}"
          # Image platforms; the ARM CI server builds linux/arm64,linux/amd64
          - key: "PLATFORMS"
            value: "${QS_PLATFORMS:-linux/amd64}"

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8080/}"
  timestamper:
    allPipelines: true
  lockableResourcesManager:
    declaredResources:
      - name: "env-dev"
        description: "DEV environment: one deploy at a time"
      - name: "env-test"
        description: "TEST environment: one deploy at a time"
      - name: "env-acc"
        description: "ACC environment: one deploy at a time"
      - name: "env-prod"
        description: "PROD environment: one deploy at a time"

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              id: "agent-ssh-key"
              description: "Controller to build agent SSH key"
              scope: SYSTEM
              username: "jenkins"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/agent_ssh_key}"
          - gitHubApp:
              id: "github-app"
              description: "GitHub App quantsim-jenkins: repository access, commit statuses, release tags"
              appID: "${github_app_id}"
              privateKey: "${readFile:/run/secrets/github_app_key}"
          - usernamePassword:
              id: "ghcr-push"
              description: "GitHub Container Registry: push and pull QuantSim images"
              scope: GLOBAL
              username: "${ghcr_user}"
              password: "${ghcr_token}"
          - string:
              id: "cloudflare-api-token"
              description: "Cloudflare API token with Pages edit permission"
              scope: GLOBAL
              secret: "${cloudflare_api_token}"
          - string:
              id: "cloudflare-account-id"
              description: "Cloudflare account id"
              scope: GLOBAL
              secret: "${cloudflare_account_id}"
          - file:
              id: "sops-age-key"
              description: "age private key that decrypts deploy/secrets"
              scope: GLOBAL
              fileName: "sops_age_key"
              secretBytes: "${readFileBase64:/run/secrets/sops_age_key}"

jobs:
  - script: |
      multibranchPipelineJob('quantsim') {
        displayName('QuantSim')
        description('Builds every branch and pull request of QuantSim-FYP. develop, test, acceptance and main deploy to DEV, TEST, ACC and PROD.')
        branchSources {
          branchSource {
            source {
              github {
                id('quantsim-fyp')
                repoOwner('Ali-Mazhar05')
                repository('QuantSim-FYP')
                repositoryUrl('https://github.com/Ali-Mazhar05/QuantSim-FYP')
                configuredByUrl(true)
                credentialsId('github-app')
                traits {
                  // 3 = build every branch, including ones that also have a pull request
                  gitHubBranchDiscovery { strategyId(3) }
                  // 1 = build pull requests merged with their target branch
                  gitHubPullRequestDiscovery { strategyId(1) }
                  // develop-poc and master are deliberately left out
                  headWildcardFilter {
                    includes('main acceptance test develop feature/* bugfix/* hotfix/* PR-*')
                    excludes('')
                  }
                }
              }
            }
          }
        }
        factory {
          workflowBranchProjectFactory { scriptPath('Jenkinsfile') }
        }
        orphanedItemStrategy {
          discardOldItems { daysToKeep(7) }
        }
        triggers {
          // Webhooks start builds at once when Jenkins has a public URL; this scan also
          // catches every push when it does not (a laptop host)
          periodicFolderTrigger { interval('${QS_SCAN_INTERVAL:-2m}') }
        }
      }
