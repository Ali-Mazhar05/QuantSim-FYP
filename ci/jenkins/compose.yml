# Runs QuantSim Jenkins: a controller that schedules and a build agent that builds.
# The same files run on a laptop and on the CI server; ci/jenkins/.env (written by
# init-env.sh) says which. From the repository root:
#
#   ci/jenkins/init-env.sh                      once, on a new host
#   docker compose -f ci/jenkins/compose.yml up -d --build
#   docker compose -f ci/jenkins/compose.yml logs -f
#   docker compose -f ci/jenkins/compose.yml down          (data is kept)
#
# Team members who take turns hosting use ci/jenkins/host.sh instead, which hands
# Jenkins' state over through Cloudflare R2 and adds the "shared" and "tunnel"
# profiles below (host lease and public link).
#
# On the CI server .env also sets COMPOSE_FILE, which adds compose.server.yml (HTTPS
# with Caddy and GitHub sign-in).
name: quantsim-jenkins

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  jenkins:
    build: .
    image: quantsim-jenkins:2.580.1
    restart: unless-stopped
    ports:
      # 127.0.0.1 on the CI server, where Caddy is the only way in
      - "${JENKINS_BIND:-0.0.0.0}:${JENKINS_PORT:-8080}:8080"
    environment:
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8080/}
      # Login: per-person accounts generated by init-env.sh on laptops, GitHub sign-in on
      # the CI server
      CASC_JENKINS_CONFIG: /usr/share/jenkins/casc/jenkins.yaml,${JENKINS_SECURITY_CASC:-/usr/share/jenkins/casc/security/local.yaml}
      QS_RELEASE_APPROVERS: ${QS_RELEASE_APPROVERS:-admin}
      QS_PLATFORMS: ${QS_PLATFORMS:-linux/amd64}
      QS_SCAN_INTERVAL: ${QS_SCAN_INTERVAL:-2m}
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./.state/security-local.yaml:/usr/share/jenkins/casc-team/security-local.yaml:ro
    secrets:
      - admin_password
      - agent_ssh_key
      - github_app_id
      - github_app_key
      - ghcr_user
      - ghcr_token
      - cloudflare_api_token
      - cloudflare_account_id
      - sops_age_key
    depends_on:
      - agent
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2g
    logging: *logging

  # Every build runs here. It uses the host's Docker for builds and deploys, so DEV
  # and TEST run on whichever machine hosts Jenkins.
  agent:
    build: ./agent
    image: quantsim-jenkins-agent:jdk21
    restart: unless-stopped
    environment:
      JENKINS_AGENT_SSH_PUBKEY: ${AGENT_SSH_PUBKEY:?run ci/jenkins/init-env.sh first}
    volumes:
      - agent_home:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 4g
    logging: *logging

  # Free public https://<random>.trycloudflare.com link to Jenkins; the address is
  # printed in this service's log and changes every time it restarts.
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2025.9.1@sha256:4604b477520dc8322af5427da68b44f0bf814938e9d2e4814f2249ee4b03ffdf
    # The metrics port publishes the current address at /quicktunnel for the lease
    # HTTP/2 over TCP 443 works on networks that block the default QUIC (UDP)
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--metrics", "0.0.0.0:2000", "--url", "http://jenkins:8080"]
    restart: unless-stopped
    depends_on:
      - jenkins
    logging: *logging

  # Shared hosting: records in R2 every 2 minutes that this machine hosts Jenkins
  lease:
    profiles: ["shared"]
    image: rclone/rclone:1.71@sha256:3103526c506266a9ecdf064efe99bf3677d92ef6407af124d8c56b4f49cbaa51
    entrypoint: ["/bin/sh", "/lease.sh"]
    restart: unless-stopped
    environment:
      HOST_ID: ${HOST_ID:?run ci/jenkins/init-env.sh first}
      QS_STATE_BUCKET: ${QS_STATE_BUCKET:-quantsim-ci}
      QS_STATE_ENDPOINT: ${QS_STATE_ENDPOINT:-}
      QS_STATE_PROVIDER: ${QS_STATE_PROVIDER:-Cloudflare}
    volumes:
      - ./lease.sh:/lease.sh:ro
    secrets:
      - r2_access_key_id
      - r2_secret_access_key
      - cloudflare_account_id
    logging: *logging

volumes:
  jenkins_home:
  agent_home:

secrets:
  admin_password:
    file: ./secrets/admin_password
  agent_ssh_key:
    file: ./secrets/agent_ssh_key
  github_app_id:
    file: ./secrets/github_app_id
  github_app_key:
    file: ./secrets/github_app_key
  ghcr_user:
    file: ./secrets/ghcr_user
  ghcr_token:
    file: ./secrets/ghcr_token
  cloudflare_api_token:
    file: ./secrets/cloudflare_api_token
  cloudflare_account_id:
    file: ./secrets/cloudflare_account_id
  sops_age_key:
    file: ./secrets/sops_age_key
  # Only needed for shared hosting (host.sh)
  r2_access_key_id:
    file: ./secrets/r2_access_key_id
  r2_secret_access_key:
    file: ./secrets/r2_secret_access_key
