# One stack definition for every environment. deploy.sh runs it with:
#   -p <QS_PROJECT>                      a separate project per environment (qs-dev, qs-test, ...)
#   --env-file deploy/env/<env>.env      ports, targets and other settings
#   --env-file <release file>            the exact image of every component
#   --env-file <decrypted secrets>       SOPS secrets, when the environment has any
#
# Nothing here mounts files from the repository: compose runs inside the Jenkins
# container, whose workspace paths do not exist on the Docker host.

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Read-only, filtered access to the Docker API so the gateway never holds the raw socket
  socket-proxy:
    <<: *defaults
    image: tecnativa/docker-socket-proxy:v0.4.1@sha256:3400c429c5f9e1b21d62130fb93b16e2e772d4fb7695bd52fc2b743800b9fe9e
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    deploy:
      resources:
        limits:
          memory: 64M

  # Single front door of the environment
  gateway:
    <<: *defaults
    image: traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    command:
      - --entrypoints.web.address=:8000
      - --entrypoints.ping.address=:8082
      - --ping.entrypoint=ping
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${QS_PROJECT:?}_default
      # Every environment shares one Docker host; route only this project's containers
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`${QS_PROJECT:?}`)
      - --api.dashboard=false
      - --accesslog=true
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
    ports:
      - "${QS_HTTP_PORT:?}:8000"
    read_only: true
    depends_on:
      - socket-proxy
    networks:
      - default
      - docker-api
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=ping", "--entrypoints.ping.address=:8082"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M

  # Static frontend served by nginx; on ACC and PROD it is published to Cloudflare Pages instead
  frontend:
    <<: *defaults
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE comes from the release file}
    profiles: ["frontend"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    labels:
      traefik.enable: "true"
      traefik.http.routers.frontend.rule: PathPrefix(`/`)
      traefik.http.routers.frontend.entrypoints: web
      traefik.http.routers.frontend.priority: "1"
      traefik.http.services.frontend.loadbalancer.server.port: "8080"
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------------
  # Shared infrastructure. Nothing here publishes a host port; only the gateway does.

  # PostgreSQL 17 + TimescaleDB. One server, one database and one login role per service
  # (NFR-MNT-002, NFR-SEC-007), created by db-init.
  postgres:
    <<: *defaults
    image: timescale/timescaledb:2.22.1-pg17@sha256:fba60021a224479e174ae1ec577c1a0576d5185b09fe9e622f1d19e4bf5bab0d
    environment:
      POSTGRES_USER: qs_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD comes from the environment's secrets}
      POSTGRES_DB: postgres
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      # TCP check: only the real server, not the initialisation one, accepts it
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U qs_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g

  # Creates each service's database and role, and keeps their passwords in step with the
  # secrets. Idempotent; runs before every service's migrations.
  db-init:
    image: timescale/timescaledb:2.22.1-pg17@sha256:fba60021a224479e174ae1ec577c1a0576d5185b09fe9e622f1d19e4bf5bab0d
    profiles: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: qs_admin
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: postgres
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD comes from the environment's secrets}
    networks:
      - backend
    entrypoint: ["sh", "-ec"]
    command:
      - |
        create() {
          psql -v ON_ERROR_STOP=1 -q -v name="$$1" -v pw="$$2" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN', :'name')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'name') \gexec
        ALTER ROLE :"name" WITH LOGIN PASSWORD :'pw';
        SELECT format('CREATE DATABASE %I OWNER %I', :'name', :'name')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'name') \gexec
        REVOKE ALL ON DATABASE :"name" FROM PUBLIC;
        GRANT CONNECT, TEMPORARY ON DATABASE :"name" TO :"name";
        SQL
          echo "database and role ready: $$1"
        }
        create platform "$$PLATFORM_DB_PASSWORD"

  # Redis: the shared token revocation list now, the job queue later. Append-only file
  # so revocations survive a restart.
  redis:
    <<: *defaults
    image: redis:8.2-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  # Redpanda: the event backbone (Kafka protocol), single node
  redpanda:
    <<: *defaults
    image: redpandadata/redpanda:v25.2.9@sha256:bd6c35647153a4dbc19507c8037dcca0802484c23e6e5fbb97591a62539e313a
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=${REDPANDA_MEMORY:-768M}
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g

  # ---------------------------------------------------------------------------------
  # M0 Platform & Identity. Each service follows this pattern: the API behind the
  # gateway at /api/<name>, an outbox relay, and a <name>-migrate one-off that deploy.sh
  # runs before the new version starts.

  platform:
    <<: *defaults
    image: ${PLATFORM_IMAGE:?PLATFORM_IMAGE comes from the release file}
    environment: &platform-env
      QS_ENVIRONMENT: ${QS_ENV:?}
      QS_CORS_ORIGINS: ${QS_CORS_ORIGINS:-}
      QS_DATABASE_URL: postgresql+asyncpg://platform:${PLATFORM_DB_PASSWORD:?}@postgres:5432/platform
      QS_REDIS_URL: redis://redis:6379/0
      QS_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      QS_SIGNING_KEY: ${PLATFORM_SIGNING_KEY:?PLATFORM_SIGNING_KEY comes from the environment's secrets}
      QS_SIGNING_KEY_ID: ${PLATFORM_SIGNING_KEY_ID:?}
      QS_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Accounts: sign-up switch, the site emailed links point to, and outgoing mail
      # (Gmail as alimazhar3005+QuantSim@gmail.com in every environment)
      QS_SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      QS_PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is the environment's website}
      QS_EMAIL_REQUIRED: ${EMAIL_REQUIRED:-false}
      QS_SMTP_HOST: ${SMTP_HOST:-}
      QS_SMTP_PORT: ${SMTP_PORT:-587}
      QS_SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      QS_SMTP_USERNAME: ${SMTP_USERNAME:-}
      QS_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      QS_SMTP_FROM: ${SMTP_FROM:-QuantSim <alimazhar3005+QuantSim@gmail.com>}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - backend
    labels:
      traefik.enable: "true"
      traefik.http.routers.platform.rule: PathPrefix(`/api/platform`)
      traefik.http.routers.platform.entrypoints: web
      traefik.http.services.platform.loadbalancer.server.port: "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 384M

  platform-relay:
    <<: *defaults
    image: ${PLATFORM_IMAGE:?}
    command: ["relay"]
    environment: *platform-env
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 192M

  platform-migrate:
    image: ${PLATFORM_IMAGE:?}
    profiles: ["migrate"]
    restart: "no"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      <<: *platform-env
      QS_BOOTSTRAP_ADMIN_USERNAME: admin
      QS_BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@quantsim.dev}
      QS_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD comes from the environment's secrets}
      # DEV and TEST only: test.admin, test.quant, test.analyst and test.viewer
      QS_TEST_USERS_PASSWORD: ${TEST_USERS_PASSWORD:-}
      QS_TEST_USERS_EMAIL: ${TEST_USERS_EMAIL:-alimazhar3005@gmail.com}
    networks:
      - backend
    entrypoint: ["sh", "-ec"]
    command:
      - >-
        alembic upgrade head && qs-platform bootstrap-admin &&
        if [ -n "$$QS_TEST_USERS_PASSWORD" ]; then qs-platform seed-test-users; fi

  # Public HTTPS address of this environment's API (a free Cloudflare quick tunnel to the
  # gateway), so browsers anywhere can reach it. The address changes when the tunnel
  # restarts; deploy.sh and host.sh publish the current one to the website's config.json.
  api-tunnel:
    <<: *defaults
    image: cloudflare/cloudflared:2025.9.1@sha256:4604b477520dc8322af5427da68b44f0bf814938e9d2e4814f2249ee4b03ffdf
    # The metrics port answers /quicktunnel with the current address
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--metrics", "0.0.0.0:2000", "--url", "http://gateway:8000"]
    depends_on:
      - gateway
    networks:
      - default
    read_only: true
    deploy:
      resources:
        limits:
          memory: 64M

  # Optional local inbox (profile "mailpit"): catches every account email instead of
  # sending it, for working offline. Its inbox is on the host only, at
  # http://localhost:${MAILPIT_PORT}
  mailpit:
    <<: *defaults
    image: axllent/mailpit:v1.27.11@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    profiles: ["mailpit"]
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
      - /data
    deploy:
      resources:
        limits:
          memory: 64M

  # Further backend services follow the platform pattern above: add the service to
  # ci/components.conf, a block here routed at /api/<name>, a <name>-relay and a
  # <name>-migrate, and its database to db-init.

networks:
  default:
  docker-api:
    internal: true
  # Databases, cache and broker: reachable by the services only, never from outside
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
